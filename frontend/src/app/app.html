<div class="app-shell">
  <header class="topbar">
    <div class="brand-wrap">
      <div class="brand-mark">I</div>
      <span class="brand-name">InkStation</span>
    </div>

    <nav class="main-nav" aria-label="Navegação principal">
      @if (authService.estaAutenticado) {
        <a routerLink="/catalogo">Estações</a>
        <a routerLink="/agendamento">Agendamento</a>
        <a routerLink="/minhas-reservas">Minhas reservas</a>
        <a routerLink="/reservas-pagas">Reservas pagas</a>
        <button type="button" class="logout-button" (click)="sair()">Sair</button>
      }
    </nav>
  </header>

  <main class="page-content">
    <router-outlet></router-outlet>
  </main>

  @if (authService.estaAutenticado) {
    <app-chatbot />
  }
</div>
