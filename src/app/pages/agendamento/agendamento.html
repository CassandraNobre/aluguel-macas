<section class="agendamento-page">
  <div class="booking-card">
    <header class="booking-header">
      <p class="eyebrow">Reserva</p>
      <h1>Agendar estação de trabalho</h1>
    </header>

    <div class="booking-layout">
      <form class="booking-form" (ngSubmit)="confirmar()">
        <label class="field-group">
          <span>Data da sessão</span>
          <input type="date" name="dataSessao" [(ngModel)]="dataSessao" [min]="dataMinima" required />
        </label>

        <div class="time-row">
          <label class="field-group">
            <span>Horário de início</span>
            <input type="time" name="horarioInicio" [(ngModel)]="horarioInicio" (ngModelChange)="atualizarHorarioFinal()" required />
          </label>

          <label class="field-group">
            <span>Horário de término</span>
            <input type="time" name="horarioFim" [(ngModel)]="horarioFim" required />
          </label>
        </div>

        <label class="field-group">
          <span>Estimativa de duração</span>
          <select name="duracaoEstimada" [(ngModel)]="duracaoEstimada" (ngModelChange)="atualizarHorarioFinal()">
            <option [ngValue]="2">2 horas</option>
            <option [ngValue]="4">4 horas</option>
            <option [ngValue]="6">6 horas</option>
            <option [ngValue]="8">Diária (8 horas)</option>
          </select>
        </label>

        <label class="field-group">
          <span>Observações da sessão</span>
          <textarea name="observacoes" rows="4" placeholder="Descreva a proposta da tatuagem, materiais ou qualquer necessidade especial..." [(ngModel)]="observacoes"></textarea>
        </label>

        <label class="checkbox-group">
          <input type="checkbox" name="biosseguranca" [(ngModel)]="biosseguranca" />
          <span>Confirmo que irei seguir o termo de biossegurança e levarei meus insumos descartáveis.</span>
        </label>

        @if (erro) {
          <p class="booking-error" role="alert">{{ erro }}</p>
        }

        <button type="submit" class="confirm-button">Confirmar agendamento</button>
      </form>

      <aside class="summary-panel">
        <h2>Resumo</h2>

        <div class="summary-item">
          <span>Estação</span>
          <strong>{{ selectedEstacao.nome }}</strong>
        </div>

        <div class="summary-item">
          <span>Período</span>
          <strong>{{ dataResumo }} · {{ horarioInicio }} às {{ horarioFim }}</strong>
        </div>

        <div class="summary-item">
          <span>Valor por hora</span>
          <strong>R$ {{ selectedEstacao.preco }},00</strong>
        </div>

        <div class="summary-item total-row">
          <span>Total</span>
          <strong>R$ {{ valorTotal.toFixed(2).replace('.', ',') }}</strong>
        </div>
      </aside>
    </div>
  </div>
</section>
